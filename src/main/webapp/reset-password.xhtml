<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:c="jakarta.tags.core"
                template="/WEB-INF/templates/public.xhtml">

  <ui:define name="title">Choose a new password</ui:define>

  <ui:define name="metadata">
    <f:metadata>
      <f:viewParam name="token" value="#{passwordResetBean.token}"/>
      <f:viewAction action="#{passwordResetBean.loadToken}"/>
    </f:metadata>
  </ui:define>

  <ui:define name="content">
    <h2>Choose a new password</h2>

    <h:messages globalOnly="true" styleClass="messages" infoClass="info" warnClass="warn"
                errorClass="error" fatalClass="fatal" layout="list"/>

    <c:if test="#{passwordResetBean.tokenUsable}">
      <h:form prependId="false">
        <div class="form-grid">
          <div class="field">
            <h:outputLabel for="newPassword" value="New password"/>
            <h:inputSecret id="newPassword" value="#{passwordResetBean.newPassword}"
                           required="true" autocomplete="new-password" redisplay="false"
                           requiredMessage="Choose a new password."/>
            <span class="hint">At least 12 characters with upper case, lower case, a digit
                  and a symbol.</span>
            <h:message for="newPassword" styleClass="error-text"/>
          </div>
          <div class="field">
            <h:outputLabel for="confirmPassword" value="Confirm new password"/>
            <h:inputSecret id="confirmPassword" value="#{passwordResetBean.confirmPassword}"
                           required="true" autocomplete="new-password" redisplay="false"
                           requiredMessage="Confirm your new password."/>
            <h:message for="confirmPassword" styleClass="error-text"/>
          </div>
          <h:commandButton value="Set new password" action="#{passwordResetBean.completeReset}"
                           styleClass="btn btn--primary btn--block"/>
        </div>
      </h:form>
    </c:if>

    <c:if test="#{not passwordResetBean.tokenUsable}">
      <div class="alert alert--warning" role="alert">
        <span class="alert__icon" aria-hidden="true">!</span>
        <span>This link is no longer valid. Reset links can only be used once and expire
              quickly.</span>
      </div>
      <h:link outcome="/forgot-password" value="Request a new link"
              styleClass="btn btn--primary btn--block"/>
    </c:if>

    <p class="small" style="margin-top:16px">
      <h:link outcome="/login" value="Back to sign in"/>
    </p>
  </ui:define>
</ui:composition>
