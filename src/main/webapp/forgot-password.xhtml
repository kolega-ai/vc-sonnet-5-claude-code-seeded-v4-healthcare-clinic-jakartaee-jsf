<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="/WEB-INF/templates/public.xhtml">

  <ui:define name="title">Reset your password</ui:define>

  <ui:define name="content">
    <h2>Reset your password</h2>
    <p class="muted">Enter your email address and we will send a single-use link that is
       valid for a short time.</p>

    <h:messages globalOnly="true" styleClass="messages" infoClass="info" warnClass="warn"
                errorClass="error" fatalClass="fatal" layout="list"/>

    <h:form prependId="false">
      <div class="form-grid">
        <div class="field">
          <h:outputLabel for="resetEmail" value="Email address"/>
          <h:inputText id="resetEmail" value="#{passwordResetBean.email}" required="true"
                       type="email" autocomplete="username"
                       requiredMessage="Enter your email address."/>
          <h:message for="resetEmail" styleClass="error-text"/>
          <span class="hint">In this local build the message is written to the clinic's
                outbox rather than emailed.</span>
        </div>
        <h:commandButton value="Send reset link" action="#{passwordResetBean.requestReset}"
                         styleClass="btn btn--primary btn--block"/>
      </div>
    </h:form>

    <p class="small" style="margin-top:16px">
      <h:link outcome="/login" value="Back to sign in"/>
    </p>
  </ui:define>
</ui:composition>
